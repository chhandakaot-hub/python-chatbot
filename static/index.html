<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python AI Bot</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --sidebar: #f0f2f5;
    --border: #dfe3e8;
    --text: #1a1d21;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-text: #ffffff;
    --bubble-user: #4f46e5;
    --bubble-user-text: #ffffff;
    --bubble-bot: #eef0f4;
    --danger: #dc2626;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --panel: #1e2127;
      --sidebar: #191c21;
      --border: #2e333c;
      --text: #e8eaed;
      --muted: #9aa1ac;
      --accent: #6d63ff;
      --bubble-bot: #262b33;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  button { font: inherit; cursor: pointer; border: none; border-radius: 8px; }
  input, textarea { font: inherit; color: var(--text); }
  .hidden { display: none !important; }

  /* ---------- auth ---------- */
  #auth {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
  }
  .card h1 { margin: 0 0 4px; font-size: 20px; }
  .card p.sub { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .field input {
    width: 100%; padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px;
  }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; gap: 10px; margin-top: 18px; }
  .btn-primary { flex: 1; padding: 10px; background: var(--accent); color: var(--accent-text); }
  .btn-ghost {
    flex: 1; padding: 10px; background: transparent;
    border: 1px solid var(--border); color: var(--text);
  }
  .btn-primary:disabled, .btn-ghost:disabled { opacity: .55; cursor: default; }
  .msg-error {
    margin-top: 14px; padding: 9px 11px; font-size: 13px;
    background: rgba(220, 38, 38, .12);
    color: var(--danger); border-radius: 8px;
  }

  /* ---------- app shell ---------- */
  #app { height: 100%; display: grid; grid-template-columns: 260px 1fr; }
  aside {
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  .side-head { padding: 14px; border-bottom: 1px solid var(--border); }
  .new-chat { width: 100%; padding: 9px; background: var(--accent); color: var(--accent-text); }
  #conv-list { flex: 1; overflow-y: auto; padding: 8px; min-height: 0; }
  .conv {
    display: flex; align-items: center; gap: 6px;
    padding: 9px 10px; margin-bottom: 3px; border-radius: 8px;
    cursor: pointer; font-size: 13.5px;
  }
  .conv:hover { background: var(--bubble-bot); }
  .conv.active { background: var(--bubble-bot); font-weight: 600; }
  .conv span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv button {
    background: none; color: var(--muted); padding: 2px 5px;
    opacity: 0; font-size: 15px; line-height: 1;
  }
  .conv:hover button { opacity: 1; }
  .conv button:hover { color: var(--danger); }
  .side-foot {
    padding: 12px 14px; border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; font-size: 12.5px;
  }
  .side-foot span { flex: 1; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .side-foot button { background: none; color: var(--muted); padding: 4px 6px; }
  .side-foot button:hover { color: var(--danger); }

  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 24px; min-height: 0; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .turn { display: flex; margin-bottom: 16px; }
  .turn.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%; padding: 11px 14px; border-radius: 14px;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .turn.user .bubble { background: var(--bubble-user); color: var(--bubble-user-text); border-bottom-right-radius: 4px; }
  .turn.bot .bubble { background: var(--bubble-bot); border-bottom-left-radius: 4px; }
  .bubble code {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: .9em; padding: 1px 5px; border-radius: 5px;
    background: rgba(127, 127, 127, .18);
  }
  .bubble pre {
    margin: 8px 0; padding: 10px 12px; border-radius: 8px; overflow-x: auto;
    background: rgba(127, 127, 127, .15);
  }
  .bubble pre code { background: none; padding: 0; }
  .bubble strong { font-weight: 650; }

  .empty { text-align: center; color: var(--muted); margin-top: 18vh; }
  .empty h2 { font-size: 17px; margin: 0 0 6px; color: var(--text); }
  .empty p { margin: 0; font-size: 13.5px; }
  .dots span {
    display: inline-block; width: 6px; height: 6px; margin-right: 3px;
    background: var(--muted); border-radius: 50%; animation: blink 1.2s infinite;
  }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }

  footer { border-top: 1px solid var(--border); background: var(--panel); padding: 14px 24px; }
  .composer { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  .composer textarea {
    flex: 1; resize: none; max-height: 180px;
    padding: 11px 13px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 10px;
  }
  .composer textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .composer button { padding: 11px 20px; background: var(--accent); color: var(--accent-text); }
  .composer button:disabled { opacity: .5; cursor: default; }
  .hint { max-width: 760px; margin: 6px auto 0; font-size: 11.5px; color: var(--muted); }

  @media (max-width: 700px) {
    #app { grid-template-columns: 1fr; }
    aside { display: none; }
    #messages { padding: 16px; }
    footer { padding: 12px 16px; }
    .bubble { max-width: 88%; }
  }
</style>
</head>
<body>

<!-- ---------------- auth ---------------- -->
<section id="auth">
  <form class="card" id="auth-form">
    <h1>Python AI Bot</h1>
    <p class="sub">Sign in, or register a new account.</p>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" minlength="8" required>
    </div>
    <div class="row">
      <button type="submit" class="btn-primary" id="btn-login">Sign in</button>
      <button type="button" class="btn-ghost" id="btn-register">Register</button>
    </div>
    <div class="msg-error hidden" id="auth-error"></div>
  </form>
</section>

<!-- ---------------- app ---------------- -->
<section id="app" class="hidden">
  <aside>
    <div class="side-head">
      <button class="new-chat" id="btn-new">+ New chat</button>
    </div>
    <div id="conv-list"></div>
    <div class="side-foot">
      <span id="who"></span>
      <button id="btn-logout" title="Sign out">Sign out</button>
    </div>
  </aside>

  <main>
    <div id="messages">
      <div class="wrap" id="thread"></div>
    </div>
    <footer>
      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="Send a message..." autocomplete="off"></textarea>
        <button type="submit" id="btn-send">Send</button>
      </form>
      <div class="hint">Enter to send &middot; Shift+Enter for a new line</div>
    </footer>
  </main>
</section>

<script>
const API = "/api";
const store = {
  get token() { return localStorage.getItem("token"); },
  set token(v) { v ? localStorage.setItem("token", v) : localStorage.removeItem("token"); },
  get email() { return localStorage.getItem("email") || ""; },
  set email(v) { v ? localStorage.setItem("email", v) : localStorage.removeItem("email"); },
};

let conversationId = null;
let sending = false;

const $ = (id) => document.getElementById(id);

/* ---------------- http ---------------- */
async function api(path, options) {
  const { method = "GET", body, form } = options || {};
  const headers = {};
  if (store.token) headers.Authorization = "Bearer " + store.token;
  if (body) headers["Content-Type"] = "application/json";

  const res = await fetch(API + path, {
    method: method,
    headers: headers,
    body: form ? new URLSearchParams(form) : body ? JSON.stringify(body) : undefined,
  });

  if (res.status === 401 && store.token) {
    signOut();
    throw new Error("Session expired. Sign in again.");
  }
  if (res.status === 204) return null;

  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(detailOf(data) || "Request failed (" + res.status + ")");
  return data;
}

// FastAPI returns `detail` as a string, or as a list for validation errors.
function detailOf(data) {
  const d = data && data.detail;
  if (!d) return "";
  if (typeof d === "string") return d;
  if (Array.isArray(d)) return d.map((e) => e.msg).join(", ");
  return "";
}

/* ---------------- auth ---------------- */
function showError(message) {
  const box = $("auth-error");
  box.textContent = message;
  box.classList.remove("hidden");
}

function busy(state) {
  $("btn-login").disabled = state;
  $("btn-register").disabled = state;
}

async function signIn(email, password) {
  // The form endpoint names the field `username`, but it holds the email.
  const data = await api("/auth/token", {
    method: "POST",
    form: { username: email, password: password },
  });
  store.token = data.access_token;
  store.email = email;
  await openApp();
}

$("auth-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("auth-error").classList.add("hidden");
  busy(true);
  try {
    await signIn($("email").value.trim(), $("password").value);
  } catch (err) {
    showError(err.message);
  } finally {
    busy(false);
  }
});

$("btn-register").addEventListener("click", async () => {
  $("auth-error").classList.add("hidden");
  const email = $("email").value.trim();
  const password = $("password").value;
  if (!email || password.length < 8) {
    showError("Enter an email and a password of at least 8 characters.");
    return;
  }
  busy(true);
  try {
    await api("/auth/register", { method: "POST", body: { email: email, password: password } });
    await signIn(email, password);
  } catch (err) {
    showError(err.message);
  } finally {
    busy(false);
  }
});

function signOut() {
  store.token = null;
  store.email = null;
  conversationId = null;
  $("app").classList.add("hidden");
  $("auth").classList.remove("hidden");
  $("password").value = "";
}

$("btn-logout").addEventListener("click", signOut);

/* ---------------- conversations ---------------- */
async function loadConversations() {
  const list = $("conv-list");
  list.textContent = "";
  const conversations = await api("/conversations");

  conversations.forEach((c) => {
    const row = document.createElement("div");
    row.className = "conv" + (c.id === conversationId ? " active" : "");

    const label = document.createElement("span");
    label.textContent = c.title;          // textContent, so titles cannot inject markup
    label.title = c.title;
    row.appendChild(label);

    const del = document.createElement("button");
    del.textContent = "×";
    del.title = "Delete conversation";
    del.addEventListener("click", async (e) => {
      e.stopPropagation();
      await api("/conversations/" + c.id, { method: "DELETE" });
      if (c.id === conversationId) newChat();
      else loadConversations();
    });
    row.appendChild(del);

    row.addEventListener("click", () => openConversation(c.id));
    list.appendChild(row);
  });
}

async function openConversation(id) {
  conversationId = id;
  const detail = await api("/conversations/" + id);
  $("thread").textContent = "";
  detail.messages.forEach((m) => addTurn(m.role === "assistant" ? "bot" : "user", m.content));
  scrollDown();
  loadConversations();
}

function newChat() {
  conversationId = null;
  $("thread").textContent = "";
  showEmptyState();
  loadConversations();
  $("input").focus();
}

$("btn-new").addEventListener("click", newChat);

/* ---------------- messages ---------------- */
function showEmptyState() {
  const box = document.createElement("div");
  box.className = "empty";
  const h = document.createElement("h2");
  h.textContent = "Start a conversation";
  const p = document.createElement("p");
  p.textContent = "Ask anything. Replies come from Gemini.";
  box.appendChild(h);
  box.appendChild(p);
  $("thread").appendChild(box);
}

// Gemini answers in markdown. The text is HTML-escaped first, so the only
// markup that reaches the page is what these rules put back.
function escapeHtml(text) {
  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function renderMarkdown(text) {
  const blocks = [];
  let html = escapeHtml(text);

  // Fenced code blocks are parked behind placeholders first, so the inline
  // rules below cannot rewrite anything inside them.
  html = html.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, function (match, code) {
    blocks.push(code.replace(/\n$/, ""));
    return "@@BLOCK" + (blocks.length - 1) + "@@";
  });

  html = html.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  html = html.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  html = html.replace(/^\s*[-*]\s+/gm, "• ");

  // Newlines around a block are swallowed: the <pre> brings its own spacing,
  // and the bubble is pre-wrap, so leaving them doubles the gap.
  return html.replace(/\n*@@BLOCK(\d+)@@\n*/g, function (match, index) {
    return "<pre><code>" + blocks[index] + "</code></pre>";
  });
}

function addTurn(who, text) {
  const empty = $("thread").querySelector(".empty");
  if (empty) empty.remove();

  const turn = document.createElement("div");
  turn.className = "turn " + who;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if (who === "bot") {
    bubble.innerHTML = renderMarkdown(text);   // escaped inside renderMarkdown
  } else {
    bubble.textContent = text;
  }
  turn.appendChild(bubble);
  $("thread").appendChild(turn);
  return turn;
}

function addTyping() {
  const turn = addTurn("bot", "");
  const dots = document.createElement("span");
  dots.className = "dots";
  dots.appendChild(document.createElement("span"));
  dots.appendChild(document.createElement("span"));
  dots.appendChild(document.createElement("span"));
  turn.querySelector(".bubble").appendChild(dots);
  scrollDown();
  return turn;
}

function scrollDown() {
  const box = $("messages");
  box.scrollTop = box.scrollHeight;
}

const input = $("input");
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 180) + "px";
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    $("composer").requestSubmit();
  }
});

$("composer").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || sending) return;

  sending = true;
  $("btn-send").disabled = true;
  input.value = "";
  input.style.height = "auto";

  addTurn("user", text);
  scrollDown();
  const typing = addTyping();

  try {
    const data = await api("/chat", {
      method: "POST",
      body: { message: text, conversation_id: conversationId },
    });
    typing.remove();
    addTurn("bot", data.reply.content);
    const isNew = conversationId === null;
    conversationId = data.conversation_id;
    if (isNew) loadConversations();
  } catch (err) {
    typing.remove();
    addTurn("bot", "[error] " + err.message);
  } finally {
    sending = false;
    $("btn-send").disabled = false;
    scrollDown();
    input.focus();
  }
});

/* ---------------- boot ---------------- */
async function openApp() {
  $("auth").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("who").textContent = store.email;
  $("who").title = store.email;
  newChat();
}

(async function boot() {
  if (!store.token) return;
  try {
    const me = await api("/users/me");   // confirms the stored token is still valid
    store.email = me.email;
    await openApp();
  } catch (err) {
    signOut();
  }
})();
</script>
</body>
</html>
